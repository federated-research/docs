version: 2
updates:
  # Keeps the reusable workflows and actions up to date. "chore" does not trigger a release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(dependencies): "

  # Security updates only: no routine version bumps. "fix" triggers a patch release.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(dependencies): "
    groups:
      npm_and_yarn:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Hold on Next 15 / Nextra 3 / React 18 until the Nextra 4 migration is done
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nextra*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react*"
        update-types: ["version-update:semver-major"]
